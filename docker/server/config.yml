server:
  app_name: My Geek Time
  run_mode: debug
  http_addr: 0.0.0.0
  http_port: 8090
jwt:
  secret: my-geektime-secret
  expires: 86400
i18n:
  directory: i18n
  default_lang: zh-CN
database:
  driver: postgres   # mysql|postgres|sqlite
  source: host=postgres user=postgres password=postgres dbname=mygeektime port=5432 sslmode=disable TimeZone=Asia/Shanghai
  max_idle_conns: 20
  max_open_conns: 100
storage: 
  driver: local
  directory: repo  # Customize download folder, default to execute repo directory under the directory
  bucket: object
  host: http://127.0.0.1:8090  # Keep the port consistent with the http_port in the server
browser:
  open_browser: false
site:
  download: false
  cache: false
  register:
    types:
     - name
  login:
    types:
     - name 
    guest:
      name:
        account:
        password:
      email:
        account:
        password:
  play:
    type: origin  #  origin | local
    proxy_url:
      - https://res001.geekbang.org
      # - https://media001.geekbang.org
  proxy:
    cache: true
    cache_prefix: resource
    proxy_url: /v2/file/proxy?url={url}
    urls:
      - https://static001.geekbang.org/resource/image/*
      - https://static001.geekbang.org/account/avatar/*
      - https://static001.geekbang.org/files/resource/*
  email:
    smtp:
      host: smtp.example.com
      port: "587"
      username: noreply@example.com
      password: your_password
      from: noreply@example.com